# A release at the push of a button: Actions → Release → Run workflow.
# Raises the version in package.json, tags v1.2.3 and builds the app for
# macOS (universal), Windows (x64 and ARM) and Linux (x64 and ARM). The release
# stays a draft until every system is attached – with the files the updater
# reads (latest*.yml, blockmaps) – and is published then. Installed apps find
# it within six hours; flowplan.org/download offers it right away. After a
# failed build, "rebuild" with the version (e.g. 1.0.1) builds it again and
# fills its draft release, without raising the version.
name: Release
run-name: "Release · ${{ inputs.rebuild != '' && format('rebuild {0}', inputs.rebuild) || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      rebuild:
        description: "Only to build an existing version again: its number, e.g. 1.0.1 (leave empty for a new release)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Only maintainers can dispatch this workflow.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # The tags and commits for the release notes (scripts/release-notes.mjs).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: version
        env:
          REBUILD: ${{ inputs.rebuild }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$REBUILD" ]; then
            # "1.0.1", "v1.0.1", " V1.0.1 " – all mean the same version.
            version="$(printf '%s' "$REBUILD" | tr -d '[:space:]' | sed -E 's/^[vV]//')"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::rebuild needs a version like 1.0.1 (got '$REBUILD')"
              exit 1
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::There is no tag v$version to build again."
              exit 1
            fi
            # The draft of a failed release, or a new one if it is missing.
            gh release view "v$version" > /dev/null 2>&1 || gh release create "v$version" --draft --generate-notes --title "Flowplan Desktop $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            npm version "${{ inputs.bump }}" --no-git-tag-version
            echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi
      # The curated notes (release-notes/1.2.3.json, #223) become the release
      # body – what installed apps show under "Was ist neu?" – with the
      # commits folded away; without the file GitHub's generated notes and a
      # warning, the release still goes out. Before the tag: the commits
      # since the last one.
      - name: Commit, tag and draft release
        if: inputs.rebuild == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          notes=(--generate-notes)
          if [ -f "release-notes/$version.json" ]; then
            node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning title=No curated release notes::release-notes/$version.json is missing – the release gets GitHub's generated notes, and \"What's new?\" in the app shows those."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release v$version"
          git tag "v$version"
          git push origin main "v$version"
          gh release create "v$version" --draft "${notes[@]}" --title "Flowplan Desktop $version"

  # macOS and Windows apps need those systems: GitHub's runners. Unsigned
  # without certificates; with the secrets CSC_LINK/CSC_KEY_PASSWORD (macOS,
  # plus APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID for
  # notarization) and WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD (Windows) signed.
  # MAC_PROVISIONING_PROFILE (optional) adds Touch ID for passkeys (#356).
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Version
        shell: bash
        run: |
          echo "Building v$VERSION (tag refs/tags/v$VERSION)"
          [ -n "$VERSION" ] || { echo "::error::The version job gave no version."; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Signed macOS app can update itself
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          printf '{\n  "macSigned": %s\n}\n' "$SIGNED" > build/update.json
          cat build/update.json
      # Touch ID for passkeys in the window (optional, #356): only with the
      # secret MAC_PROVISIONING_PROFILE – a Developer ID provisioning profile
      # for app.flowplan.desktop, base64 – and a signed
      # build. scripts/touchid.mjs checks the profile against APPLE_TEAM_ID,
      # writes the main app's entitlements (keychain-access-groups,
      # application identifier, team) and names the keychain group in
      # build/update.json; the Build step embeds the profile. Without the
      # secret this step changes nothing: build/entitlements.mac.plist, no
      # profile, passkeys in the browser – exactly as before.
      - name: Touch ID for passkeys (macOS, optional)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          SECRET_MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          if [ -z "$SECRET_MAC_PROVISIONING_PROFILE" ]; then
            echo "No MAC_PROVISIONING_PROFILE: built without Touch ID, passkeys go to the browser."
            exit 0
          fi
          team="$(printf '%s' "$SECRET_APPLE_TEAM_ID" | tr -d '[:space:]')"
          if [ "$SIGNED" != true ] || [ -z "$team" ]; then
            echo "::warning title=Touch ID::MAC_PROVISIONING_PROFILE needs CSC_LINK and APPLE_TEAM_ID as well – built without Touch ID."
            exit 0
          fi
          profile="$RUNNER_TEMP/flowplan.provisionprofile"
          printf '%s' "$SECRET_MAC_PROVISIONING_PROFILE" | base64 --decode > "$profile"
          security cms -D -i "$profile" -o "$RUNNER_TEMP/profile.plist" || { echo "::error title=MAC_PROVISIONING_PROFILE::not a provisioning profile (base64 of the .provisionprofile file)"; exit 1; }
          # A Developer ID profile provisions every Mac, and an expired one
          # keeps the app from launching.
          [ "$(plutil -extract ProvisionsAllDevices raw -o - "$RUNNER_TEMP/profile.plist" 2>/dev/null)" = true ] || { echo "::error title=MAC_PROVISIONING_PROFILE::not a Developer ID profile (ProvisionsAllDevices missing)"; exit 1; }
          expires="$(plutil -extract ExpirationDate raw -o - "$RUNNER_TEMP/profile.plist")"
          node -e 'process.exit(Date.parse(process.argv[1]) > Date.now() + 86400000 ? 0 : 1)' "$expires" || { echo "::error title=MAC_PROVISIONING_PROFILE::the profile expired ($expires)"; exit 1; }
          echo "Profile $(plutil -extract Name raw -o - "$RUNNER_TEMP/profile.plist"), valid until $expires"
          plutil -extract Entitlements json -o "$RUNNER_TEMP/profile-entitlements.json" "$RUNNER_TEMP/profile.plist"
          node scripts/touchid.mjs "$team" "$RUNNER_TEMP/profile-entitlements.json" "$RUNNER_TEMP/entitlements.touchid.plist"
          rm -f "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/profile-entitlements.json"
          echo "TOUCHID_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "TOUCHID_ENTITLEMENTS=$RUNNER_TEMP/entitlements.touchid.plist" >> "$GITHUB_ENV"
          cat build/update.json
      # Apple Intelligence on the Mac (optional, native/device-ai): a small
      # Swift helper, built universal, signed in the Build step (Developer ID,
      # hardened runtime, timestamp), placed in Contents/MacOS by
      # electron-builder (build.mac.extraFiles) and notarized with the app.
      # FoundationModels needs the macOS 26 SDK (Xcode 26); with an older one
      # the helper still builds and reports the model as unavailable.
      - name: Apple Intelligence helper (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if ! xcrun --sdk macosx --show-sdk-version | grep -Eq '^(2[6-9]|[3-9][0-9])'; then
            xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
            if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode/Contents/Developer"; fi
          fi
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk, $(swift --version 2>&1 | head -n 1)"
          if ! printf '%s' "$sdk" | grep -Eq '^(2[6-9]|[3-9][0-9])'; then
            echo "::warning::macOS SDK $sdk has no FoundationModels: the helper will report Apple Intelligence as unavailable."
          fi
          cd native/device-ai
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          mkdir -p dist
          cp "$bin/device-ai" dist/device-ai
          chmod 755 dist/device-ai
          lipo -info dist/device-ai
          # It answers and ends when stdin closes (on this runner: unavailable).
          printf '{"id":"1","type":"availability"}\n' | ./dist/device-ai
      - name: Build
        shell: bash
        env:
          # Under other names: electron-builder must only see signing
          # variables that are actually set – an empty CSC_LINK counts as a
          # file path and fails the build.
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            secret="SECRET_$name"
            if [ -n "${!secret}" ]; then export "$name=${!secret}"; fi
          done
          # Windows signs only with a Windows certificate (WIN_CSC_LINK).
          # electron-builder otherwise falls back to CSC_LINK – the macOS
          # Developer ID certificate, which Windows does not trust: the
          # updater then refused every update as "not signed by the
          # application owner" (flowplan#379). No Windows certificate: unsigned.
          if [ "$RUNNER_OS" = Windows ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          # Without a certificate: build unsigned instead of searching for one.
          if [ -z "${CSC_LINK:-}" ] && [ -z "${WIN_CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          # macOS: import the certificate into a keychain of our own instead of
          # electron-builder's temporary one – on current macOS runners its
          # `security set-key-partition-list` fails to unlock that keychain.
          if [ "$RUNNER_OS" = macOS ] && [ -n "${CSC_LINK:-}" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            password="$(openssl rand -hex 24)"
            printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "${CSC_KEY_PASSWORD:-}" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/certificate.p12"
            identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -n 1)"
            [ -n "$identity" ] || { echo "::error::No 'Developer ID Application' certificate in CSC_LINK."; security find-identity -v -p codesigning "$keychain"; exit 1; }
            echo "Signing as Developer ID Application: $identity"
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_KEYCHAIN="$keychain" CSC_NAME="$identity"
            # electron-builder signs Contents/MacOS/Flowplan but not the other
            # executables next to it, and codesign refuses an app whose
            # Contents/MacOS holds an unsigned one: sign the helper first, the
            # way notarization wants it (hardened runtime, timestamp).
            helper=native/device-ai/dist/device-ai
            if [ -f "$helper" ]; then
              codesign --sign "Developer ID Application: $identity" --keychain "$keychain" --force --timestamp --options runtime "$helper"
              codesign --verify --strict --verbose=2 "$helper"
            fi
          fi
          # Touch ID (step above): the profile embedded and the main app's
          # entitlements – the helpers keep entitlementsInherit.
          touchid=()
          if [ "$RUNNER_OS" = macOS ] && [ -n "${TOUCHID_PROFILE:-}" ]; then
            touchid=("-c.mac.provisioningProfile=$TOUCHID_PROFILE" "-c.mac.entitlements=$TOUCHID_ENTITLEMENTS")
          fi
          npx electron-builder ${{ matrix.target }} --publish never "${touchid[@]}"
      - name: Check the Apple Intelligence helper in the app (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          shopt -s nullglob
          apps=(dist/mac*/Flowplan.app)
          [ ${#apps[@]} -gt 0 ] || { echo "::error::No Flowplan.app in dist/"; exit 1; }
          for app in "${apps[@]}"; do
            helper="$app/Contents/MacOS/device-ai"
            [ -x "$helper" ] || { echo "::error::$helper is missing"; exit 1; }
            lipo -info "$helper"
            if [ "$SIGNED" = true ]; then
              # Signed like the app: same team, hardened runtime, a timestamp.
              codesign --verify --strict --verbose=2 "$helper"
              details="$(codesign -dv --verbose=4 "$helper" 2>&1)"
              app_team="$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
              printf '%s\n' "$details" | grep -E '^(Authority|TeamIdentifier|Timestamp|CodeDirectory)'
              printf '%s\n' "$details" | grep -q '^Authority=Developer ID Application' || { echo "::error::device-ai is not signed with the Developer ID"; exit 1; }
              printf '%s\n' "$details" | grep -q "^TeamIdentifier=$app_team\$" || { echo "::error::device-ai is signed by another team than the app"; exit 1; }
              printf '%s\n' "$details" | grep -Eq '^CodeDirectory.*flags=.*runtime' || { echo "::error::device-ai lacks the hardened runtime"; exit 1; }
              printf '%s\n' "$details" | grep -q '^Timestamp=' || { echo "::error::device-ai has no secure timestamp"; exit 1; }
              codesign --verify --deep --strict --verbose=2 "$app"
            fi
            # Touch ID (#356): the profile embedded, the keychain group in
            # the app's entitlements alone; without it neither.
            entitlements="$(codesign -d --entitlements - --xml "$app" 2>/dev/null || true)"
            if [ -n "${TOUCHID_PROFILE:-}" ]; then
              cmp -s "$TOUCHID_PROFILE" "$app/Contents/embedded.provisionprofile" || { echo "::error::The provisioning profile is not embedded in $app"; exit 1; }
              group="$(node -p 'require("./build/update.json").touchID')"
              printf '%s' "$entitlements" | grep -q "<string>$group</string>" || { echo "::error::$app lacks keychain-access-groups $group"; exit 1; }
              for helper in "$app"/Contents/Frameworks/*.app "$app/Contents/MacOS/device-ai"; do
                if codesign -d --entitlements - --xml "$helper" 2>/dev/null | grep -q keychain-access-groups; then echo "::error::$helper must not have keychain-access-groups"; exit 1; fi
              done
              echo "Touch ID: profile embedded, keychain group $group"
            else
              [ ! -e "$app/Contents/embedded.provisionprofile" ] || { echo "::error::A provisioning profile in $app without MAC_PROVISIONING_PROFILE"; exit 1; }
              if printf '%s' "$entitlements" | grep -q keychain-access-groups; then echo "::error::keychain-access-groups without MAC_PROVISIONING_PROFILE"; exit 1; fi
              node -e 'process.exit(require("./build/update.json").touchID === undefined ? 0 : 1)' || { echo "::error::build/update.json names Touch ID without a profile"; exit 1; }
            fi
          done
      # A signed Windows installer must carry a signature Windows trusts –
      # an untrusted one stops every installed copy from updating (#379).
      - name: Windows signature is trusted or absent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist -Filter *.exe) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host "$($file.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'NotSigned') {
              Write-Error "$($file.Name) is signed but Windows does not trust the signature ($($sig.Status))."
              exit 1
            }
          }
          $yml = Get-Content dist/win-unpacked/resources/app-update.yml -Raw -ErrorAction SilentlyContinue
          if ($yml -match 'Developer ID Application') { Write-Error 'app-update.yml names a macOS certificate as publisher.'; exit 1 }
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.tar.gz dist/*.blockmap dist/latest*.yml)
          gh release upload "v$VERSION" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
