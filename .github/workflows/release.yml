# A release at the push of a button: Actions → Release → Run workflow.
# Raises the version in package.json, tags v1.2.3 and builds the app for
# macOS (universal), Windows (x64 and ARM) and Linux (x64 and ARM). The release
# stays a draft until every system is attached – with the files the updater
# reads (latest*.yml, blockmaps) – and is published then. Installed apps find
# it within six hours; flowplan.org/download offers it right away. After a
# failed build, "rebuild" with the version (e.g. 1.0.1) builds it again and
# fills its draft release, without raising the version.
name: Release
run-name: "Release · ${{ inputs.rebuild != '' && format('rebuild {0}', inputs.rebuild) || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      rebuild:
        description: "Only to build an existing version again: its number, e.g. 1.0.1 (leave empty for a new release)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Own runner (label self-hosted): only maintainers can dispatch this
    # workflow, so no fork or Dependabot code ever runs here.
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: version
        env:
          REBUILD: ${{ inputs.rebuild }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$REBUILD" ]; then
            # "1.0.1", "v1.0.1", " V1.0.1 " – all mean the same version.
            version="$(printf '%s' "$REBUILD" | tr -d '[:space:]' | sed -E 's/^[vV]//')"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::rebuild needs a version like 1.0.1 (got '$REBUILD')"
              exit 1
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::There is no tag v$version to build again."
              exit 1
            fi
            # The draft of a failed release, or a new one if it is missing.
            gh release view "v$version" > /dev/null 2>&1 || gh release create "v$version" --draft --generate-notes --title "Flowplan Desktop $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            npm version "${{ inputs.bump }}" --no-git-tag-version
            echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit, tag and draft release
        if: inputs.rebuild == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release v$version"
          git tag "v$version"
          git push origin main "v$version"
          gh release create "v$version" --draft --generate-notes --title "Flowplan Desktop $version"

  # macOS and Windows apps need those systems: GitHub's runners. Unsigned
  # without certificates; with the secrets CSC_LINK/CSC_KEY_PASSWORD (macOS,
  # plus APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID for
  # notarization) and WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD (Windows) signed.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Version
        shell: bash
        run: |
          echo "Building v$VERSION (tag refs/tags/v$VERSION)"
          [ -n "$VERSION" ] || { echo "::error::The version job gave no version."; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Signed macOS app can update itself
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          printf '{\n  "macSigned": %s\n}\n' "$SIGNED" > build/update.json
          cat build/update.json
      # Apple Intelligence on the Mac (optional, native/device-ai): a small
      # Swift helper, built universal, signed in the Build step (Developer ID,
      # hardened runtime, timestamp), placed in Contents/MacOS by
      # electron-builder (build.mac.extraFiles) and notarized with the app.
      # FoundationModels needs the macOS 26 SDK (Xcode 26); with an older one
      # the helper still builds and reports the model as unavailable.
      - name: Apple Intelligence helper (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if ! xcrun --sdk macosx --show-sdk-version | grep -Eq '^(2[6-9]|[3-9][0-9])'; then
            xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
            if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode/Contents/Developer"; fi
          fi
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk, $(swift --version 2>&1 | head -n 1)"
          if ! printf '%s' "$sdk" | grep -Eq '^(2[6-9]|[3-9][0-9])'; then
            echo "::warning::macOS SDK $sdk has no FoundationModels: the helper will report Apple Intelligence as unavailable."
          fi
          cd native/device-ai
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          mkdir -p dist
          cp "$bin/device-ai" dist/device-ai
          chmod 755 dist/device-ai
          lipo -info dist/device-ai
          # It answers and ends when stdin closes (on this runner: unavailable).
          printf '{"id":"1","type":"availability"}\n' | ./dist/device-ai
      - name: Build
        shell: bash
        env:
          # Under other names: electron-builder must only see signing
          # variables that are actually set – an empty CSC_LINK counts as a
          # file path and fails the build.
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            secret="SECRET_$name"
            if [ -n "${!secret}" ]; then export "$name=${!secret}"; fi
          done
          # Without a certificate: build unsigned instead of searching for one.
          if [ -z "${CSC_LINK:-}" ] && [ -z "${WIN_CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          # macOS: import the certificate into a keychain of our own instead of
          # electron-builder's temporary one – on current macOS runners its
          # `security set-key-partition-list` fails to unlock that keychain.
          if [ "$RUNNER_OS" = macOS ] && [ -n "${CSC_LINK:-}" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            password="$(openssl rand -hex 24)"
            printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "${CSC_KEY_PASSWORD:-}" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/certificate.p12"
            identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -n 1)"
            [ -n "$identity" ] || { echo "::error::No 'Developer ID Application' certificate in CSC_LINK."; security find-identity -v -p codesigning "$keychain"; exit 1; }
            echo "Signing as Developer ID Application: $identity"
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_KEYCHAIN="$keychain" CSC_NAME="$identity"
            # electron-builder signs Contents/MacOS/Flowplan but not the other
            # executables next to it, and codesign refuses an app whose
            # Contents/MacOS holds an unsigned one: sign the helper first, the
            # way notarization wants it (hardened runtime, timestamp).
            helper=native/device-ai/dist/device-ai
            if [ -f "$helper" ]; then
              codesign --sign "Developer ID Application: $identity" --keychain "$keychain" --force --timestamp --options runtime "$helper"
              codesign --verify --strict --verbose=2 "$helper"
            fi
          fi
          npx electron-builder ${{ matrix.target }} --publish never
      - name: Check the Apple Intelligence helper in the app (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          shopt -s nullglob
          apps=(dist/mac*/Flowplan.app)
          [ ${#apps[@]} -gt 0 ] || { echo "::error::No Flowplan.app in dist/"; exit 1; }
          for app in "${apps[@]}"; do
            helper="$app/Contents/MacOS/device-ai"
            [ -x "$helper" ] || { echo "::error::$helper is missing"; exit 1; }
            lipo -info "$helper"
            if [ "$SIGNED" = true ]; then
              # Signed like the app: same team, hardened runtime, a timestamp.
              codesign --verify --strict --verbose=2 "$helper"
              details="$(codesign -dv --verbose=4 "$helper" 2>&1)"
              app_team="$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
              printf '%s\n' "$details" | grep -E '^(Authority|TeamIdentifier|Timestamp|CodeDirectory)'
              printf '%s\n' "$details" | grep -q '^Authority=Developer ID Application' || { echo "::error::device-ai is not signed with the Developer ID"; exit 1; }
              printf '%s\n' "$details" | grep -q "^TeamIdentifier=$app_team\$" || { echo "::error::device-ai is signed by another team than the app"; exit 1; }
              printf '%s\n' "$details" | grep -Eq '^CodeDirectory.*flags=.*runtime' || { echo "::error::device-ai lacks the hardened runtime"; exit 1; }
              printf '%s\n' "$details" | grep -q '^Timestamp=' || { echo "::error::device-ai has no secure timestamp"; exit 1; }
              codesign --verify --deep --strict --verbose=2 "$app"
            fi
          done
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.tar.gz dist/*.blockmap dist/latest*.yml)
          gh release upload "v$VERSION" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [version, build]
    runs-on: self-hosted
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
