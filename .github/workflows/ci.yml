# Every push and pull request: syntax check, the tests without a network, a
# supported Electron and a Linux test build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub's runners: code from pull requests never reaches an own machine.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git on the runner.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Security guards (Node only)
        run: npm run test:security
      - name: Certificates (Node only)
        # Self-signed certificates (#271): the pin a profile keeps, the
        # verify proc's decision and that every request to an instance goes
        # through Chromium.
        run: npm run test:certificates
      - name: Features (Node only)
        # Context menu, quick capture, tray, links, page windows, files,
        # launch at login, printing and the update toast – the decisions, and
        # what the app asks an instance against a local stand-in.
        run: npm run test:features
      - name: Apple Intelligence (Node only)
        # The on-device model's bridge: requests checked, the helper process
        # (a stand-in) started, streamed, cancelled, restarted and stopped.
        run: npm run test:device-ai
      - name: Electron still supported
        # Electron keeps the latest three majors patched. An installed major
        # older than latest − 2 gets no Chromium security fixes any more.
        run: |
          installed="$(node -p 'require("electron/package.json").version.split(".")[0]')"
          latest="$(npm view electron dist-tags.latest | cut -d. -f1)"
          oldest=$((latest - 2))
          echo "Electron $installed installed; supported: $oldest to $latest"
          if [ "$installed" -lt "$oldest" ]; then
            echo "::error::Electron $installed is end-of-life (supported majors: $oldest to $latest). Upgrade electron in package.json."
            exit 1
          fi
      - name: Offline use (Electron under xvfb)
        run: |
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a npm run test:offline
          else
            echo "::warning::xvfb-run is not installed on this runner; the offline test was skipped."
          fi
      - name: Profiles (Electron under xvfb)
        run: |
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a npm run test:profiles
          else
            echo "::warning::xvfb-run is not installed on this runner; the profiles test was skipped."
          fi
      - name: Notifications (Electron under xvfb)
        run: |
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a npm run test:notifications
          else
            echo "::warning::xvfb-run is not installed on this runner; the notifications test was skipped."
          fi
      - name: Desktop features (Electron under xvfb)
        run: |
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a npm run test:app
          else
            echo "::warning::xvfb-run is not installed on this runner; the app test was skipped."
          fi
      - name: Apple Intelligence bridge (Electron under xvfb)
        run: |
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a npm run test:device-ai-app
          else
            echo "::warning::xvfb-run is not installed on this runner; the Apple Intelligence app test was skipped."
          fi
      - name: Passkeys (Electron under xvfb)
        # Windows Hello in the window (simulated: WebAuthn against Chromium's
        # virtual authenticator), the fallback to the browser, and macOS/Linux
        # unchanged.
        run: |
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a npm run test:passkeys
          else
            echo "::warning::xvfb-run is not installed on this runner; the passkeys test was skipped."
          fi
      - name: Self-signed certificates (Electron under xvfb)
        # An HTTPS stand-in with a certificate no system trusts: asked before
        # it is trusted, pinned for that host alone, a changed certificate
        # warned about with both fingerprints, the pin removed again.
        run: |
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a npm run test:certificates-app
          else
            echo "::warning::xvfb-run is not installed on this runner; the certificates app test was skipped."
          fi
      - name: Test build (Linux, unpacked)
        run: npx electron-builder --linux dir --publish never
