name: Bug report
description: Something in the desktop app (macOS, Windows, Linux) does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This repository is for the **desktop app** – the window, menus, tray, quick capture, updates, file handling.
        If the problem also happens in the browser, please report it in the [main Flowplan repository](https://github.com/yannicschuller/flowplan/issues/new/choose) instead.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/yannicschuller/flowplan-desktop/issues?q=is%3Aissue) (open and closed) and this has not been reported yet.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the app
        2. Press the quick capture shortcut
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System version and package
      description: For Linux also the package (AppImage, .deb, .rpm …).
      placeholder: "macOS 26.1 (Apple silicon) · Windows 11 · Ubuntu 24.04, AppImage"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: "In the menu under **About Flowplan**."
      placeholder: "1.3.3"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server
      description: "The Flowplan server the app is connected to: \"flowplan.org\", or for a self-hosted server its version (in Flowplan under **Settings → About Flowplan**)."
      placeholder: "flowplan.org · self-hosted 0.9.0"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Error messages or logs – please remove anything private.
      render: text
