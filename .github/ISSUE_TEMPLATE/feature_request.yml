name: Feature request
description: Suggest an idea for the desktop app
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas for Flowplan itself (editor, databases, whiteboards …) belong in the [main Flowplan repository](https://github.com/yannicschuller/flowplan/issues/new/choose). Here: what only the desktop app can do – menus, shortcuts, tray, quick capture, files, system integration.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/yannicschuller/flowplan-desktop/issues?q=is%3Aissue) (open and closed).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the use case first.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
  - type: textarea
    id: context
    attributes:
      label: Anything else?
