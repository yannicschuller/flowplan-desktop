<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'" />
    <title data-i18n-title="offline.title">No connection</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <img src="../build/icon.png" alt="" />
      <h1 data-i18n="offline.heading">No connection to Flowplan</h1>
      <p id="detail" data-i18n="offline.text">The server cannot be reached right now. Check your internet connection or the address of the instance.</p>
      <div class="row">
        <button id="retry" data-i18n="offline.retry">Try again</button>
        <button id="change" class="secondary" data-i18n="offline.changeServer">Change server</button>
      </div>
    </main>
    <script src="../strings.js"></script>
    <script src="i18n.js"></script>
    <script src="offline.js"></script>
  </body>
</html>
